name: 📊 Обновить метрики связности

on:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут (UTC)
  workflow_dispatch:        # + возможность запустить вручную

permissions:
  contents: write           # Даём workflow права на запись в репо

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонировать репо
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получить всю историю для корректного подсчёта
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔍 Проверить токен
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "❌ GITHUB_TOKEN не найден!"
            exit 1
          else
            echo "✅ GITHUB_TOKEN есть"
            echo "Токен доступен как: secrets.GITHUB_TOKEN"
          fi

      - name: 📊 Запустить скрипт обновления метрик
        env:
          GITHUB_TOKEN: ${{ secrets.ICTP_DASH || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 TOKEN length: ${#GITHUB_TOKEN}"
          echo "🔍 REPO: denisrudomanenko-stack/IC.TP"
          echo "🔍 Using token: $([ -n '${{ secrets.ICTP_DASH }}' ] && echo 'ICTP_DASH' || echo 'GITHUB_TOKEN')"
          node fetch-metrics.js

      - name: 📋 Показать обновлённые метрики
        run: |
          echo "=== Полные метрики ==="
          cat metrics.json
          echo ""
          echo "=== Ключевые значения ==="
          jq '.overallConnectivity, .team_coordination.active_members, .commitRegularity.weeklyCommits' metrics.json

      - name: 💾 Коммитить обновлённые метрики
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          if git diff --quiet metrics.json; then
            echo "✓ Метрики не изменились"
          else
            echo "📝 Коммитим обновлённые метрики..."
            git add metrics.json
            git commit -m "chore: обновить метрики связности системы [automated]"
            git push https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
          fi
